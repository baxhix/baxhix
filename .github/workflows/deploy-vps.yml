name: Deploy VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy on self-hosted VPS
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_APP_DIR:-}" ]; then
            echo "Secret VPS_APP_DIR ausente"
            exit 1
          fi
          cd "$VPS_APP_DIR"
          git pull origin main
          docker compose up -d --build

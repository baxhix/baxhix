name: Deploy VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    env:
      BASH_ENV: /dev/null
    steps:
      - name: Deploy on self-hosted VPS
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_APP_DIR:-}" ]; then
            echo "Secret VPS_APP_DIR ausente"
            exit 1
          fi
          APP_DIR="$(printf '%s' "$VPS_APP_DIR" | tr -d '\r\n')"
          echo "Deploy dir: $APP_DIR"
          if [ ! -d "$APP_DIR" ]; then
            echo "Diretório não encontrado: $APP_DIR"
            exit 1
          fi
          git -C "$APP_DIR" pull origin main
          docker compose --project-directory "$APP_DIR" up -d --build
